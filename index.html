<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>explorer</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/xlogin"></script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#3b82f6">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <button class="topbar-collapse nav-btn" id="btn-sidebar-toggle" title="Toggle pod sidebar">☰</button>
      <h1>explorer</h1>
      <span class="sub">files on your pod</span>
      <span class="topbar-id" id="topbar-id" hidden></span>
    </div>
  </header>

  <div class="layout">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Pods</span>
    </div>
    <ul class="sidebar-list" id="sidebar-list"></ul>
    <div class="sidebar-footer">
      <button class="sidebar-add" id="btn-sidebar-add" title="Add a pod URL">+ Add pod</button>
    </div>
  </aside>

  <main>

    <!-- Hidden file inputs — one per pane for upload via popover -->
    <input type="file" class="file-picker" data-pane="0" multiple hidden>
    <input type="file" class="file-picker" data-pane="1" multiple hidden>

    <section class="view">

      <!-- Pane 0 (primary, always visible) -->
      <div class="pane" data-pane="0">
        <section class="urlbar">
          <button class="nav-btn btn-back" title="Back (Backspace)" disabled>←</button>
          <button class="nav-btn btn-up" title="Up (parent container)">↑</button>
          <button class="nav-btn btn-refresh" title="Refresh (R)">↻</button>
          <input class="url" type="text" placeholder="http://localhost:4443/public/" spellcheck="false">
          <button class="nav-btn btn-go">Go</button>
          <span class="urlbar-sep"></span>
          <div class="popover-host">
            <button class="nav-btn btn-new" title="New… (N)">＋</button>
            <div class="popover popover-new" hidden>
              <button class="popover-item" data-action="container">New container</button>
              <button class="popover-item" data-action="file">New file</button>
              <button class="popover-item" data-action="upload">Upload files…</button>
            </div>
          </div>
          <button class="nav-btn btn-split" title="Split view">⊟</button>
        </section>
        <nav class="breadcrumb"></nav>
        <div class="listing-wrap">
          <div class="listing-header">
            <span class="col-name">name</span>
            <span class="col-acl" title="Who has access">access</span>
            <span class="col-size">size</span>
            <span class="col-modified">modified</span>
          </div>
          <ol class="listing">
            <li class="empty">Enter a pod URL above and press Go.</li>
          </ol>
          <div class="drop-overlay" hidden>
            <div class="drop-overlay-inner">Drop to upload</div>
          </div>
        </div>
      </div>

      <!-- Pane 1 (secondary, hidden until split is enabled) -->
      <div class="pane" data-pane="1" hidden>
        <section class="urlbar">
          <button class="nav-btn btn-back" title="Back" disabled>←</button>
          <button class="nav-btn btn-up" title="Up">↑</button>
          <button class="nav-btn btn-refresh" title="Refresh">↻</button>
          <input class="url" type="text" placeholder="http://localhost:4443/public/" spellcheck="false">
          <button class="nav-btn btn-go">Go</button>
          <span class="urlbar-sep"></span>
          <div class="popover-host">
            <button class="nav-btn btn-new" title="New…">＋</button>
            <div class="popover popover-new" hidden>
              <button class="popover-item" data-action="container">New container</button>
              <button class="popover-item" data-action="file">New file</button>
              <button class="popover-item" data-action="upload">Upload files…</button>
            </div>
          </div>
          <button class="nav-btn btn-close-pane" title="Close split">×</button>
        </section>
        <nav class="breadcrumb"></nav>
        <div class="listing-wrap">
          <div class="listing-header">
            <span class="col-name">name</span>
            <span class="col-acl" title="Who has access">access</span>
            <span class="col-size">size</span>
            <span class="col-modified">modified</span>
          </div>
          <ol class="listing">
            <li class="empty">Enter a pod URL above and press Go.</li>
          </ol>
          <div class="drop-overlay" hidden>
            <div class="drop-overlay-inner">Drop to upload</div>
          </div>
        </div>
      </div>

      <aside class="preview" id="preview" hidden>
        <div class="preview-header">
          <span class="preview-title" id="preview-title">—</span>
          <button class="nav-btn" id="btn-close-preview" title="Close preview">×</button>
        </div>
        <div class="preview-meta" id="preview-meta"></div>
        <div class="preview-body" id="preview-body"></div>
      </aside>

      <aside class="acl-editor" id="acl-editor" hidden>
        <div class="acl-header">
          <span class="acl-title" id="acl-title">Permissions</span>
          <button class="nav-btn" id="btn-close-acl" title="Close (Esc)">×</button>
        </div>
        <div class="acl-meta" id="acl-meta"></div>
        <div class="acl-body" id="acl-body"></div>
        <div class="acl-footer">
          <button class="nav-btn" id="btn-acl-add" title="Add authorization">+ Add</button>
          <span class="acl-spacer"></span>
          <button class="nav-btn" id="btn-acl-cancel">Cancel</button>
          <button class="nav-btn acl-save" id="btn-acl-save">Save</button>
        </div>
      </aside>

    </section>

    <footer class="status" id="status">idle</footer>

  </main>

  </div>

  <!-- Toast (delete undo, etc.) — hidden until something needs saying -->
  <div class="toast" id="toast" hidden>
    <span class="toast-msg" id="toast-msg"></span>
    <button class="toast-action" id="toast-action" hidden></button>
    <button class="toast-close" id="toast-close" title="Dismiss">×</button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
